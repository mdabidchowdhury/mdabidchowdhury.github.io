ing mechanism that lets UAVs hang onto cylindrical structures for extended data collection.",tags:["Bio-Inspired Design","UAV Perching","FEA"],detail:`This thesis project designs, simulates, and prototypes a bat-inspired passive locking and active unlocking perching system that allows a UAV to persistently hang onto cylindrical structures such as poles and branches, enabling extended aerial data collection without continuous flight power draw.
